[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-feature-engineering"
version = "0.1.0"
description = "Pipeline reproduzível de feature engineering para risco de crédito."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
notebook = [
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "sweetviz>=2.3,<3",
]

[project.scripts]
feature-engineering = "feature_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
